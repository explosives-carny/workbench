<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Workbench: a board of rows, the top one answered. The tile is the app's
       accent (the accent token in app.css), solid so it keeps its shape on a light or
       a dark tab strip; on a dark one it takes the dark theme's lighter accent
       with dark marks. Drawn on a 32 grid so the bars land on whole pixels at
       16. -->
  <style>
    @media (prefers-color-scheme: dark) {
      .tile { fill: #e8825a; }
      .bar { fill: #17181a; }
      .tick { stroke: #17181a; }
    }
  </style>
  <rect class="tile" fill="#b2451d" width="32" height="32" rx="7"/>
  <path class="tick" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M6.5 9.5l2.5 2.5 4.5-5.5"/>
  <rect class="bar" fill="#fff" x="16" y="8" width="10" height="4" rx="2"/>
  <rect class="bar" fill="#fff" x="6" y="14" width="20" height="4" rx="2"/>
  <rect class="bar" fill="#fff" x="6" y="20" width="20" height="4" rx="2"/>
</svg>
