<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workbench</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="wrap">
  <a class="back" href="/">&#8592; All projects</a>
  <header class="mast">
    <p class="eyebrow" id="eyebrow">Project</p>
    <h1 id="pname">…</h1>
    <p class="lede" id="pdesc"></p>
    <div class="rule"></div>
  </header>

  <div class="filters" id="filters" role="group" aria-label="Show items by status"></div>
  <div id="items" aria-live="polite"></div>

  <section class="newproj">
    <h2>Add an item</h2>
    <form id="newitem">
      <input type="text" id="ititle" placeholder="What needs deciding or doing" aria-label="Item title" required>
      <input type="text" id="isection" placeholder="Section (optional)" aria-label="Section">
      <input type="text" id="ilabels" placeholder="Labels, comma separated (optional)" aria-label="Labels" list="labellist" autocomplete="off">
      <datalist id="labellist"></datalist>
      <button type="submit">Add</button>
    </form>
    <!-- The labels already in use, one click to add. A near-synonym typed by
         hand ("Deploys" beside "Deploy") splits one thread of work into two
         lists that both look complete, and a filter on either misses half. -->
    <div class="labelpicks" id="labelpicks" aria-label="Labels in use"></div>
  </section>

  <footer>
    <span class="mono" id="apihint"></span>
    <a href="/agents.html">How agents use this</a>
  </footer>
</div>
<script src="/app.js"></script>
<script>
(function () {
  const slug = decodeURIComponent(location.pathname.replace(/^\/p\//, '').replace(/\/$/, ''));
  const itemsEl = document.getElementById('items');
  document.getElementById('apihint').textContent = 'GET /api/projects/' + slug;

  // Drafts and in-flight state live outside the render, so a redraw triggered by
  // an agent's write can never take the sentence you are typing with it. This is
  // the failure the tool exists to stop repeating.
  const drafts = {};
  let deferred = null;
  let items = [];
  // The project itself, for groupBy. Held rather than re-read per render.
  let project = null;

  // Completed work is hidden by default. A board that shows everything ever
  // decided stops answering the only question it is for — what is outstanding —
  // and this one is already at fourteen items on its first day.
  //
  // Per-viewer and per-project, in localStorage rather than on the item: which
  // statuses YOU want to look at is not a fact about the work, and writing it to
  // the database would make one person's filter change what another session
  // sees. Wrapped because storage throws in a private window and a filter
  // preference is never worth breaking the page over.
  const FILTER_KEY = 'wb.filters.' + slug;
  // Finished work and superseded documents are both hidden by default. They are
  // the same thing in the two vocabularies — kept, not current — and a board
  // that opens showing everything ever decided stops answering the only question
  // it is for.
  const DEFAULT_HIDDEN = ['complete', 'archived'];

  function loadHidden() {
    try {
      const raw = localStorage.getItem(FILTER_KEY);
      if (!raw) return new Set(DEFAULT_HIDDEN);
      const parsed = JSON.parse(raw);
      return new Set(Array.isArray(parsed) ? parsed.filter((s) => WB.STATUSES.includes(s)) : DEFAULT_HIDDEN);
    } catch (e) {
      return new Set(DEFAULT_HIDDEN);
    }
  }

  function saveHidden() {
    try { localStorage.setItem(FILTER_KEY, JSON.stringify([...hidden])); } catch (e) { /* not worth failing over */ }
  }

  let hidden = loadHidden();

  // One label at a time, deliberately. A multi-select needs an and/or choice
  // that nobody wants to make on a board this size, and "show me just this
  // thread of work" is what the field is actually for.
  const LABEL_KEY = 'wb.label.' + slug;
  function loadLabelFilter() {
    try { return localStorage.getItem(LABEL_KEY) || null; } catch (e) { return null; }
  }
  function saveLabelFilter() {
    try {
      if (labelFilter) localStorage.setItem(LABEL_KEY, labelFilter);
      else localStorage.removeItem(LABEL_KEY);
    } catch (e) { /* not worth failing over */ }
  }
  let labelFilter = loadLabelFilter();

  function visible() {
    return items.filter((i) =>
      !hidden.has(i.status) &&
      (!labelFilter || (i.labels || []).some((l) => l.toLowerCase() === labelFilter.toLowerCase())));
  }

  function renderFilters() {
    const el = document.getElementById('filters');
    const counts = {};
    for (const i of items) counts[i.status] = (counts[i.status] || 0) + 1;
    el.innerHTML = '';

    function toggle(s) {
      const on = !hidden.has(s);
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'filter s-' + s + (on ? '' : ' off');
      // aria-pressed, not a checkbox: these are toggles over a list that is
      // already on screen, and a screen reader should hear the state change.
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.textContent = WB.STATUS_LABELS[s] + ' ' + (counts[s] || 0);
      b.addEventListener('click', () => {
        if (hidden.has(s)) hidden.delete(s); else hidden.add(s);
        saveHidden();
        // Forced: the filter set is part of the signature, but a toggle must
        // repaint immediately rather than wait for the next poll.
        safeRender(true);
      });
      return b;
    }

    // Two clusters, because the seven statuses are not one scale. Work moves
    // through Decision → QA → Received → Deferred → Complete; a document is
    // only ever Active or Archived. Presented as one undifferentiated row they
    // read as a seven-step pipeline, and somebody eventually sets a
    // specification to "Received" trying to find the right point on it.
    //
    // Each cluster is its own labelled group so the split is announced rather
    // than merely spaced, and either can be empty without leaving a stray
    // heading — a board with no documents yet shows no Documents filters.
    const clusters = [
      { label: 'Work', statuses: WB.STATUSES.filter((s) => !WB.DOCUMENT_STATUSES.includes(s)) },
      { label: 'Documents', statuses: WB.DOCUMENT_STATUSES },
    ];
    for (const cluster of clusters) {
      const present = cluster.statuses.filter((s) => (counts[s] || 0) > 0 || !hidden.has(s));
      if (!present.length) continue;
      const box = document.createElement('span');
      box.className = 'filterset';
      box.setAttribute('role', 'group');
      box.setAttribute('aria-label', 'Show ' + cluster.label.toLowerCase() + ' by status');
      const name = document.createElement('span');
      name.className = 'filterset-label mono';
      name.textContent = cluster.label;
      box.appendChild(name);
      for (const s of present) box.appendChild(toggle(s));
      el.appendChild(box);
    }
    const group = document.createElement('span');
    group.className = 'viewgroup';
    const shownIds = visible().map((i) => i.id);
    const allOpen = shownIds.length > 0 && shownIds.every((id) => expanded.has(id));

    const expandAll = document.createElement('button');
    expandAll.type = 'button';
    expandAll.className = 'viewtoggle mono';
    expandAll.textContent = 'Expand all';
    expandAll.disabled = allOpen;
    expandAll.addEventListener('click', () => {
      // Only what is currently visible: expanding items hidden by a filter
      // would silently queue up work for the moment the filter comes off.
      for (const id of shownIds) expanded.add(id);
      safeRender(true);
    });

    const collapseAll = document.createElement('button');
    collapseAll.type = 'button';
    collapseAll.className = 'viewtoggle mono';
    collapseAll.textContent = 'Collapse all';
    collapseAll.disabled = expanded.size === 0;
    collapseAll.addEventListener('click', () => { expanded.clear(); safeRender(true); });

    group.append(expandAll, collapseAll);
    el.appendChild(group);

    // An active label filter has to be visible and undoable from here. A row
    // chip can clear it too, but only if a row carrying that label is on screen
    // — and the case where none is, is exactly the case somebody gets stuck in.
    if (labelFilter) {
      const active = document.createElement('button');
      active.type = 'button';
      active.className = 'labelfilter mono';
      active.textContent = 'label: ' + labelFilter + ' \u00d7';
      active.setAttribute('aria-label', 'Clear the label filter: ' + labelFilter);
      active.addEventListener('click', () => { labelFilter = null; saveLabelFilter(); safeRender(true); });
      el.appendChild(active);
    }

    const hiddenCount = items.length - visible().length;
    if (hiddenCount > 0) {
      const note = document.createElement('span');
      note.className = 'hiddennote mono';
      // Say what is missing. A filtered list that looks like the whole list is
      // how somebody concludes an item was lost.
      note.textContent = hiddenCount + ' hidden';
      el.appendChild(note);
    }
  }

  // Two densities over the same data. The list answers "where does this stand"
  // across fourteen items without scrolling past fourteen threads; the cards
  // answer "what is this one about" and let you reply without leaving. Which one
  // you want is a per-viewer preference, so it lives beside the filters.
  // Rows by default, each one expandable in place. The earlier design was a
  // binary list/cards switch, which forced a choice between "see where
  // everything stands" and "read this one" — the whole point is doing both at
  // once, so expansion is per row and expand-all covers the old cards mode.
  const expanded = new Set();

  function lastWord(item) {
    const msgs = item.messages || [];
    if (!msgs.length) return null;
    return msgs[msgs.length - 1];
  }

  // When this item last had anything said on it — the newest message, or when it
  // was raised if nobody has replied yet. Rows sort by this, newest first, so the
  // thing that just moved is at the top of its group and the stale one sinks.
  // Falling back to createdAt rather than 0 matters: a brand new unanswered
  // question is the most live thing on the board, not the deadest.
  function lastActivity(item) {
    const last = lastWord(item);
    const when = Date.parse((last && last.createdAt) || item.createdAt || '');
    return Number.isFinite(when) ? when : 0;
  }

  // The status groups, when the project groups by status. Open holds every live
  // TASK state: splitting them would move a piece of work between groups every
  // time it changed hands, and the per-row chip already says which it is.
  const STATUS_GROUPS = [
    { label: 'Open', statuses: ['needs-decision', 'needs-qa', 'received', 'in-progress'] },
    { label: 'Deferred', statuses: ['deferred'] },
    // Documents above Archived: a current reference is something you reach for
    // while working, not something waiting on you. An archived one joins
    // finished work, because both are kept rather than current.
    { label: 'Documents', statuses: ['active'] },
    { label: 'Archived', statuses: ['archived', 'complete'] },
  ];

  function renderRow(item) {
    const wrap = document.createElement('div');
    wrap.className = 'rowwrap';

    const a = document.createElement('div');
    a.className = 'listrow s-' + item.status + (expanded.has(item.id) ? ' open' : '');

    // The disclosure is a real button so it is reachable by keyboard and
    // announces its state; the title beside it is a link to the item's own page,
    // because "expand here" and "open that" are different intentions.
    const tog = document.createElement('button');
    tog.type = 'button';
    tog.className = 'lr-toggle';
    tog.setAttribute('aria-expanded', expanded.has(item.id) ? 'true' : 'false');
    tog.setAttribute('aria-label', (expanded.has(item.id) ? 'Collapse' : 'Expand') + ': ' + item.title);
    tog.textContent = expanded.has(item.id) ? '\u2212' : '+';
    tog.addEventListener('click', () => {
      if (expanded.has(item.id)) expanded.delete(item.id); else expanded.add(item.id);
      safeRender(true);
    });
    a.appendChild(tog);

    const main = document.createElement('div');
    main.className = 'lr-main';
    const t = document.createElement('a');
    t.className = 'lr-title';
    t.href = '/p/' + encodeURIComponent(slug) + '/i/' + encodeURIComponent(item.id);
    t.textContent = item.title;
    main.appendChild(t);
    // A document behind the row is worth saying so, because the row cannot show
    // it and the only way in is to open the item.
    // Labels sit on the row because that is where the relationship is useful —
    // seeing that three rows share one is the whole point, and it is invisible
    // if you have to open each item to find out. Clickable: reading a label and
    // wanting only that label is one gesture, not a trip to a filter menu.
    for (const label of item.labels || []) {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'lr-label mono' + (labelFilter === label ? ' on' : '');
      chip.textContent = label;
      chip.title = labelFilter === label ? 'Clear this label filter' : 'Show only items labelled ' + label;
      chip.addEventListener('click', (e) => {
        e.preventDefault();
        labelFilter = labelFilter === label ? null : label;
        saveLabelFilter();
        safeRender(true);
      });
      main.appendChild(chip);
    }
    if (item.bodyLength) {
      const doc = document.createElement('span');
      doc.className = 'lr-doc mono';
      doc.textContent = 'document';
      main.appendChild(doc);
    }
    a.appendChild(main);

    const meta = document.createElement('div');
    meta.className = 'lr-meta';

    // The three things the roll-up exists to show.
    const last = lastWord(item);
    const who = document.createElement('span');
    who.className = 'lr-who mono' + (last && last.who === 'you' ? ' you' : '');
    // An item with no replies used to show "no replies" and nothing else, so a
    // row could carry no date at all — which is exactly the row you want a date
    // on, because nothing has happened to it since it was raised.
    // The session tag after an agent's name is what separates two sessions of
    // the same tool — the same "spike" can be two workers, and the row has to
    // say which one spoke.
    who.textContent = last
      ? (last.who === 'you' ? 'you' : (last.author || 'agent') + (last.session ? '·' + last.session : '')) + ' · ' + WB.fmt(last.createdAt)
      : 'raised ' + WB.fmt(item.createdAt);
    meta.appendChild(who);

    const choice = document.createElement('span');
    choice.className = 'lr-choice';
    choice.textContent = item.choice || '—';
    meta.appendChild(choice);

    const chip = document.createElement('span');
    chip.className = 'chip s-' + item.status;
    chip.textContent = WB.STATUS_LABELS[item.status];
    meta.appendChild(chip);

    a.appendChild(meta);
    wrap.appendChild(a);

    if (expanded.has(item.id)) {
      const card = renderItem(item);
      card.classList.add('expandedcard');
      wrap.appendChild(card);
    }
    return wrap;
  }

  function statusChip(status) {
    const el = document.createElement('span');
    el.className = 'chip s-' + status;
    el.textContent = WB.STATUS_LABELS[status] || status;
    return el;
  }

  function renderItem(item) {
    const card = document.createElement('section');
    card.className = 'item s-' + item.status;
    card.id = 'item-' + item.id;

    const head = document.createElement('div');
    head.className = 'row';
    const h = document.createElement('h3');
    h.textContent = item.title;
    head.appendChild(h);
    head.appendChild(statusChip(item.status));
    card.appendChild(head);

    if (item.context) {
      const ctx = document.createElement('p');
      ctx.className = 'ctx';
      ctx.textContent = item.context;
      card.appendChild(ctx);
    }

    if (item.messages && item.messages.length) {
      const thread = document.createElement('div');
      thread.className = 'thread';
      for (const m of item.messages) {
        const d = document.createElement('div');
        d.className = 'msg ' + (m.who === 'you' ? 'you' : 'agent');
        const who = document.createElement('div');
        who.className = 'who';
        who.textContent = m.who === 'you' ? 'You' : (m.author || 'Agent') + (m.session ? '·' + m.session : '');
        const p = document.createElement('p');
        p.textContent = m.text;
        const when = document.createElement('div');
        when.className = 'when';
        when.textContent = WB.fmt(m.createdAt);
        d.append(who, p, when);
        thread.appendChild(d);
      }
      card.appendChild(thread);
    }

    if (item.options && item.options.length) {
      const opts = document.createElement('div');
      opts.className = 'opts';
      opts.setAttribute('role', 'group');
      opts.setAttribute('aria-label', item.title);
      for (const o of item.options) {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = o;
        b.setAttribute('aria-pressed', item.choice === o ? 'true' : 'false');
        b.addEventListener('click', () => choose(item.id, o));
        opts.appendChild(b);
      }
      card.appendChild(opts);
    }

    const box = document.createElement('div');
    box.className = 'replybox';
    const ta = document.createElement('textarea');
    ta.id = 'ta-' + item.id;
    ta.placeholder = item.messages && item.messages.length ? 'Reply' : 'Add a note (optional)';
    ta.setAttribute('aria-label', 'Reply on: ' + item.title);
    ta.value = drafts[item.id] || '';
    ta.addEventListener('input', () => { drafts[item.id] = ta.value; });
    ta.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); send(item.id); }
    });
    const sb = document.createElement('button');
    sb.type = 'button';
    sb.className = 'send';
    sb.textContent = 'Send';
    sb.addEventListener('click', () => send(item.id));
    box.append(ta, sb);
    card.appendChild(box);

    // A select rather than four buttons. Status is one value out of four, which
    // is what a select is for — the button row spent a whole line restating
    // options that are mutually exclusive, and the chip at the top of the card
    // already says which one is current.
    const bar = document.createElement('div');
    bar.className = 'statusbar';
    const lbl = document.createElement('label');
    lbl.className = 'lbl';
    lbl.setAttribute('for', 'st-' + item.id);
    lbl.textContent = 'Status';
    const sel = document.createElement('select');
    sel.id = 'st-' + item.id;
    sel.className = 'status s-' + item.status;
    // Only this item's own set — an issue never offers Active, a document
    // never offers Received.
    for (const s of WB.statusesFor(item.kind)) {
      const o = document.createElement('option');
      o.value = s;
      o.textContent = WB.STATUS_LABELS[s];
      if (item.status === s) o.selected = true;
      sel.appendChild(o);
    }
    sel.addEventListener('change', () => setStatus(item.id, sel.value));
    bar.append(lbl, sel);
    card.appendChild(bar);

    const saved = document.createElement('div');
    saved.className = 'saved';
    saved.id = 'saved-' + item.id;
    card.appendChild(saved);

    return card;
  }

  function note(id, text, isErr) {
    const el = document.getElementById('saved-' + id);
    if (el) { el.textContent = text; el.className = 'saved' + (isErr ? ' err' : ''); }
  }

  // The board's groups, each already filtered and sorted. Built from the VISIBLE
  // list, so a group whose every item is hidden is simply absent — no heading
  // standing over nothing, and no empty "Completed" while completed items are
  // filtered off.
  function groups(shown) {
    const byActivity = (a, b) => lastActivity(b) - lastActivity(a);
    if (project && project.groupBy === 'status') {
      return STATUS_GROUPS
        .map((g) => ({ label: g.label, items: shown.filter((i) => g.statuses.includes(i.status)).sort(byActivity) }))
        .filter((g) => g.items.length);
    }
    // Section grouping keeps its original order — first appearance in the
    // stored order — because that order is the human's, set by position.
    const order = [];
    const bySection = new Map();
    for (const item of shown) {
      const key = item.section || '';
      if (!bySection.has(key)) { bySection.set(key, []); order.push(key); }
      bySection.get(key).push(item);
    }
    return order.map((key) => ({ label: key, items: bySection.get(key).sort(byActivity) }));
  }

  function render() {
    renderFilters();
    const shown = visible();
    itemsEl.innerHTML = '';
    if (!items.length) {
      itemsEl.innerHTML = '<p class="empty">Nothing here yet. Add an item below, or let an agent add them.</p>';
      return;
    }
    if (!shown.length) {
      // Distinguishable from an empty project, and it names the way out.
      itemsEl.innerHTML = labelFilter
        ? '<p class="empty">Nothing matches the label &ldquo;' + labelFilter.replace(/[&<>]/g, '') + '&rdquo; with the statuses you have on. Clear the label above, or turn a status back on.</p>'
        : '<p class="empty">Every item is filtered out. Turn a status back on above to see them.</p>';
      return;
    }
    for (const group of groups(shown)) {
      if (group.label) {
        const head = document.createElement('div');
        head.className = 'sec-head';
        const h2 = document.createElement('h2');
        h2.textContent = group.label;
        head.appendChild(h2);
        const n = document.createElement('span');
        n.className = 'sec-count mono';
        n.textContent = group.items.length;
        head.appendChild(n);
        itemsEl.appendChild(head);
      }
      for (const item of group.items) itemsEl.appendChild(renderRow(item));
    }
  }

  // What the rendered list actually depends on. The poll runs every five
  // seconds and almost always finds nothing new, so rebuilding regardless
  // replaced every button on the page twelve times a minute — and a click that
  // lands during a rebuild hits a node that is already detached and does
  // nothing. Redrawing only on a real change removes that window entirely
  // instead of trying to dodge it.
  function signature() {
    return JSON.stringify([
      [...expanded].sort(),
      [...hidden].sort(),
      labelFilter,
      project && project.groupBy,
      items.map((i) => [i.id, i.version, i.status, i.choice, i.title, i.context, i.section, (i.labels || []).join('\u0000'), (i.messages || []).length, i.bodyLength || 0,
        (i.messages || []).length ? i.messages[i.messages.length - 1].who : '']),
    ]);
  }
  let lastSignature = null;

  // A redraw while a reply box has focus is held back until it does not, and
  // the caret is restored exactly rather than jumped to the end. Both halves
  // matter: without the first, keystrokes land in an element that is being
  // replaced; without the second, typing into the middle of a sentence throws
  // the cursor to the end of it.
  function safeRender(force) {
    const sig = signature();
    if (!force && sig === lastSignature) return;
    lastSignature = sig;
    return doRender();
  }

  function doRender() {
    const live = document.activeElement;
    const typing = live && live.tagName === 'TEXTAREA' && live.id && live.id.indexOf('ta-') === 0;
    if (typing) {
      clearTimeout(deferred);
      deferred = setTimeout(function () { doRender(); }, 2500);
      return;
    }
    const fid = live && live.id ? live.id : null;
    const start = live && live.selectionStart !== undefined ? live.selectionStart : null;
    const end = live && live.selectionEnd !== undefined ? live.selectionEnd : null;
    render();
    if (fid) {
      const again = document.getElementById(fid);
      if (again) {
        again.focus();
        if (again.setSelectionRange && start !== null) {
          try { again.setSelectionRange(start, end); } catch (e) { /* not a text field */ }
        }
      }
    }
  }

  async function load(redraw) {
    const data = await WB.get('/api/projects/' + encodeURIComponent(slug));
    // A project grouping by status has no section headings, so the section box
    // would file things somewhere nothing displays. Hide it rather than keep a
    // field whose value is invisible.
    project = data.project;
    document.getElementById('isection').hidden = project.groupBy === 'status';
    document.getElementById('pname').textContent = data.project.name;
    document.getElementById('pdesc').textContent = data.project.description || '';
    items = data.items;
    document.getElementById('eyebrow').textContent =
      WB.WAITING_ON_YOU.reduce((n, k) => n + (data.counts[k] || 0), 0) + ' waiting on you · ' + items.length + ' items';
    WB.labelChoices(data.labels || [], document.getElementById('labellist'), document.getElementById('labelpicks'), document.getElementById('ilabels'));
    if (redraw !== false) safeRender();
  }

  async function choose(id, option) {
    note(id, 'saving…');
    try {
      // Choosing an option is an answer, so it lands as `received`: the agent
      // has something to act on and has not yet acknowledged it.
      await WB.patch('/api/items/' + id, { choice: option, status: 'received' });
      await load();
      note(id, 'saved');
    } catch (e) { note(id, e.message, true); }
  }

  async function setStatus(id, status) {
    note(id, 'saving…');
    try {
      await WB.patch('/api/items/' + id, { status });
      await load();
      note(id, 'saved');
    } catch (e) { note(id, e.message, true); }
  }

  async function send(id) {
    const text = (drafts[id] || '').trim();
    if (!text) return;
    note(id, 'sending…');
    try {
      await WB.post('/api/items/' + id + '/messages', { who: 'you', text });
      drafts[id] = '';
      await load();
      note(id, 'sent');
    } catch (e) { note(id, e.message, true); }
  }

  document.getElementById('newitem').addEventListener('submit', async (e) => {
    e.preventDefault();
    const title = document.getElementById('ititle').value.trim();
    if (!title) return;
    await WB.post('/api/projects/' + encodeURIComponent(slug) + '/items', {
      title,
      section: document.getElementById('isection').value.trim(),
      labels: document.getElementById('ilabels').value.split(',').map((l) => l.trim()).filter(Boolean),
    });
    document.getElementById('ititle').value = '';
    document.getElementById('ilabels').value = '';
    await load();
  });

  load();
  setInterval(() => load(), 5000);
})();
</script>
</body>
</html>
