<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workbench</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="wrap">
  <a class="back" href="/">&#8592; All projects</a>
  <header class="mast">
    <p class="eyebrow" id="eyebrow">Project</p>
    <h1 id="pname">…</h1>
    <p class="lede" id="pdesc"></p>
    <div class="rule"></div>
  </header>

  <div class="filters" id="filters" role="group" aria-label="Show items by status"></div>
  <div id="items" aria-live="polite"></div>

  <section class="newproj">
    <h2>Add an item</h2>
    <form id="newitem">
      <input type="text" id="ititle" placeholder="What needs deciding or doing" aria-label="Item title" required>
      <input type="text" id="isection" placeholder="Section (optional)" aria-label="Section">
      <button type="submit">Add</button>
    </form>
  </section>

  <footer>
    <span class="mono" id="apihint"></span>
    <a href="/agents.html">How agents use this</a>
  </footer>
</div>
<script src="/app.js"></script>
<script>
(function () {
  const slug = decodeURIComponent(location.pathname.replace(/^\/p\//, '').replace(/\/$/, ''));
  const itemsEl = document.getElementById('items');
  document.getElementById('apihint').textContent = 'GET /api/projects/' + slug;

  // Drafts and in-flight state live outside the render, so a redraw triggered by
  // an agent's write can never take the sentence you are typing with it. This is
  // the failure the tool exists to stop repeating.
  const drafts = {};
  let deferred = null;
  let items = [];

  // Completed work is hidden by default. A board that shows everything ever
  // decided stops answering the only question it is for — what is outstanding —
  // and this one is already at fourteen items on its first day.
  //
  // Per-viewer and per-project, in localStorage rather than on the item: which
  // statuses YOU want to look at is not a fact about the work, and writing it to
  // the database would make one person's filter change what another session
  // sees. Wrapped because storage throws in a private window and a filter
  // preference is never worth breaking the page over.
  const FILTER_KEY = 'wb.filters.' + slug;
  const DEFAULT_HIDDEN = ['complete'];

  function loadHidden() {
    try {
      const raw = localStorage.getItem(FILTER_KEY);
      if (!raw) return new Set(DEFAULT_HIDDEN);
      const parsed = JSON.parse(raw);
      return new Set(Array.isArray(parsed) ? parsed.filter((s) => WB.STATUSES.includes(s)) : DEFAULT_HIDDEN);
    } catch (e) {
      return new Set(DEFAULT_HIDDEN);
    }
  }

  function saveHidden() {
    try { localStorage.setItem(FILTER_KEY, JSON.stringify([...hidden])); } catch (e) { /* not worth failing over */ }
  }

  let hidden = loadHidden();

  function visible() {
    return items.filter((i) => !hidden.has(i.status));
  }

  function renderFilters() {
    const el = document.getElementById('filters');
    const counts = {};
    for (const i of items) counts[i.status] = (counts[i.status] || 0) + 1;
    el.innerHTML = '';
    for (const s of WB.STATUSES) {
      const on = !hidden.has(s);
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'filter s-' + s + (on ? '' : ' off');
      // aria-pressed, not a checkbox: these are toggles over a list that is
      // already on screen, and a screen reader should hear the state change.
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.textContent = WB.STATUS_LABELS[s] + ' ' + (counts[s] || 0);
      b.addEventListener('click', () => {
        if (hidden.has(s)) hidden.delete(s); else hidden.add(s);
        saveHidden();
        // Forced: the filter set is part of the signature, but a toggle must
        // repaint immediately rather than wait for the next poll.
        safeRender(true);
      });
      el.appendChild(b);
    }
    const toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'viewtoggle mono';
    toggle.textContent = mode === 'list' ? 'Cards' : 'List';
    toggle.setAttribute('aria-label', mode === 'list' ? 'Switch to card view' : 'Switch to list view');
    toggle.addEventListener('click', () => {
      mode = mode === 'list' ? 'cards' : 'list';
      try { localStorage.setItem(MODE_KEY, mode); } catch (e) { /* preference only */ }
      safeRender(true);
    });
    el.appendChild(toggle);

    const hiddenCount = items.length - visible().length;
    if (hiddenCount > 0) {
      const note = document.createElement('span');
      note.className = 'hiddennote mono';
      // Say what is missing. A filtered list that looks like the whole list is
      // how somebody concludes an item was lost.
      note.textContent = hiddenCount + ' hidden';
      el.appendChild(note);
    }
  }

  // Two densities over the same data. The list answers "where does this stand"
  // across fourteen items without scrolling past fourteen threads; the cards
  // answer "what is this one about" and let you reply without leaving. Which one
  // you want is a per-viewer preference, so it lives beside the filters.
  const MODE_KEY = 'wb.mode.' + slug;
  let mode = (function () {
    try { return localStorage.getItem(MODE_KEY) === 'cards' ? 'cards' : 'list'; }
    catch (e) { return 'list'; }
  })();

  function lastWord(item) {
    const msgs = item.messages || [];
    if (!msgs.length) return null;
    return msgs[msgs.length - 1];
  }

  function renderRow(item) {
    const a = document.createElement('a');
    a.className = 'listrow s-' + item.status;
    a.href = '/p/' + encodeURIComponent(slug) + '/i/' + encodeURIComponent(item.id);

    const main = document.createElement('div');
    main.className = 'lr-main';
    const t = document.createElement('span');
    t.className = 'lr-title';
    t.textContent = item.title;
    main.appendChild(t);
    // A document behind the row is worth saying so, because the row cannot show
    // it and the only way in is to open the item.
    if (item.bodyLength) {
      const doc = document.createElement('span');
      doc.className = 'lr-doc mono';
      doc.textContent = 'document';
      main.appendChild(doc);
    }
    a.appendChild(main);

    const meta = document.createElement('div');
    meta.className = 'lr-meta';

    // The three things the roll-up exists to show.
    const last = lastWord(item);
    const who = document.createElement('span');
    who.className = 'lr-who mono' + (last && last.who === 'you' ? ' you' : '');
    who.textContent = last ? (last.who === 'you' ? 'you' : (last.author || 'agent')) + ' · ' + WB.fmt(last.createdAt) : 'no replies';
    meta.appendChild(who);

    const choice = document.createElement('span');
    choice.className = 'lr-choice';
    choice.textContent = item.choice || '—';
    meta.appendChild(choice);

    const chip = document.createElement('span');
    chip.className = 'chip s-' + item.status;
    chip.textContent = WB.STATUS_LABELS[item.status];
    meta.appendChild(chip);

    a.appendChild(meta);
    return a;
  }

  function statusChip(status) {
    const el = document.createElement('span');
    el.className = 'chip s-' + status;
    el.textContent = WB.STATUS_LABELS[status] || status;
    return el;
  }

  function renderItem(item) {
    const card = document.createElement('section');
    card.className = 'item s-' + item.status;
    card.id = 'item-' + item.id;

    const head = document.createElement('div');
    head.className = 'row';
    const h = document.createElement('h3');
    h.textContent = item.title;
    head.appendChild(h);
    head.appendChild(statusChip(item.status));
    card.appendChild(head);

    if (item.context) {
      const ctx = document.createElement('p');
      ctx.className = 'ctx';
      ctx.textContent = item.context;
      card.appendChild(ctx);
    }

    if (item.messages && item.messages.length) {
      const thread = document.createElement('div');
      thread.className = 'thread';
      for (const m of item.messages) {
        const d = document.createElement('div');
        d.className = 'msg ' + (m.who === 'you' ? 'you' : 'agent');
        const who = document.createElement('div');
        who.className = 'who';
        who.textContent = m.who === 'you' ? 'You' : (m.author || 'Agent');
        const p = document.createElement('p');
        p.textContent = m.text;
        const when = document.createElement('div');
        when.className = 'when';
        when.textContent = WB.fmt(m.createdAt);
        d.append(who, p, when);
        thread.appendChild(d);
      }
      card.appendChild(thread);
    }

    if (item.options && item.options.length) {
      const opts = document.createElement('div');
      opts.className = 'opts';
      opts.setAttribute('role', 'group');
      opts.setAttribute('aria-label', item.title);
      for (const o of item.options) {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = o;
        b.setAttribute('aria-pressed', item.choice === o ? 'true' : 'false');
        b.addEventListener('click', () => choose(item.id, o));
        opts.appendChild(b);
      }
      card.appendChild(opts);
    }

    const box = document.createElement('div');
    box.className = 'replybox';
    const ta = document.createElement('textarea');
    ta.id = 'ta-' + item.id;
    ta.placeholder = item.messages && item.messages.length ? 'Reply' : 'Add a note (optional)';
    ta.setAttribute('aria-label', 'Reply on: ' + item.title);
    ta.value = drafts[item.id] || '';
    ta.addEventListener('input', () => { drafts[item.id] = ta.value; });
    ta.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); send(item.id); }
    });
    const sb = document.createElement('button');
    sb.type = 'button';
    sb.className = 'send';
    sb.textContent = 'Send';
    sb.addEventListener('click', () => send(item.id));
    box.append(ta, sb);
    card.appendChild(box);

    // A select rather than four buttons. Status is one value out of four, which
    // is what a select is for — the button row spent a whole line restating
    // options that are mutually exclusive, and the chip at the top of the card
    // already says which one is current.
    const bar = document.createElement('div');
    bar.className = 'statusbar';
    const lbl = document.createElement('label');
    lbl.className = 'lbl';
    lbl.setAttribute('for', 'st-' + item.id);
    lbl.textContent = 'Status';
    const sel = document.createElement('select');
    sel.id = 'st-' + item.id;
    sel.className = 'status s-' + item.status;
    for (const s of WB.STATUSES) {
      const o = document.createElement('option');
      o.value = s;
      o.textContent = WB.STATUS_LABELS[s];
      if (item.status === s) o.selected = true;
      sel.appendChild(o);
    }
    sel.addEventListener('change', () => setStatus(item.id, sel.value));
    bar.append(lbl, sel);
    card.appendChild(bar);

    const saved = document.createElement('div');
    saved.className = 'saved';
    saved.id = 'saved-' + item.id;
    card.appendChild(saved);

    return card;
  }

  function note(id, text, isErr) {
    const el = document.getElementById('saved-' + id);
    if (el) { el.textContent = text; el.className = 'saved' + (isErr ? ' err' : ''); }
  }

  function render() {
    renderFilters();
    const shown = visible();
    const sections = [];
    const bySection = new Map();
    // Grouped from the FILTERED list, so a section whose every item is hidden
    // does not leave a heading standing over nothing.
    for (const item of shown) {
      const key = item.section || '';
      if (!bySection.has(key)) { bySection.set(key, []); sections.push(key); }
      bySection.get(key).push(item);
    }
    itemsEl.innerHTML = '';
    if (!items.length) {
      itemsEl.innerHTML = '<p class="empty">Nothing here yet. Add an item below, or let an agent add them.</p>';
      return;
    }
    if (!shown.length) {
      // Distinguishable from an empty project, and it names the way out.
      itemsEl.innerHTML = '<p class="empty">Every item is filtered out. Turn a status back on above to see them.</p>';
      return;
    }
    for (const key of sections) {
      if (key) {
        const head = document.createElement('div');
        head.className = 'sec-head';
        const h2 = document.createElement('h2');
        h2.textContent = key;
        head.appendChild(h2);
        itemsEl.appendChild(head);
      }
      for (const item of bySection.get(key)) itemsEl.appendChild(mode === 'list' ? renderRow(item) : renderItem(item));
    }
  }

  // What the rendered list actually depends on. The poll runs every five
  // seconds and almost always finds nothing new, so rebuilding regardless
  // replaced every button on the page twelve times a minute — and a click that
  // lands during a rebuild hits a node that is already detached and does
  // nothing. Redrawing only on a real change removes that window entirely
  // instead of trying to dodge it.
  function signature() {
    return JSON.stringify([
      mode,
      [...hidden].sort(),
      items.map((i) => [i.id, i.version, i.status, i.choice, i.title, i.context, i.section, (i.messages || []).length, i.bodyLength || 0,
        (i.messages || []).length ? i.messages[i.messages.length - 1].who : '']),
    ]);
  }
  let lastSignature = null;

  // A redraw while a reply box has focus is held back until it does not, and
  // the caret is restored exactly rather than jumped to the end. Both halves
  // matter: without the first, keystrokes land in an element that is being
  // replaced; without the second, typing into the middle of a sentence throws
  // the cursor to the end of it.
  function safeRender(force) {
    const sig = signature();
    if (!force && sig === lastSignature) return;
    lastSignature = sig;
    return doRender();
  }

  function doRender() {
    const live = document.activeElement;
    const typing = live && live.tagName === 'TEXTAREA' && live.id && live.id.indexOf('ta-') === 0;
    if (typing) {
      clearTimeout(deferred);
      deferred = setTimeout(function () { doRender(); }, 2500);
      return;
    }
    const fid = live && live.id ? live.id : null;
    const start = live && live.selectionStart !== undefined ? live.selectionStart : null;
    const end = live && live.selectionEnd !== undefined ? live.selectionEnd : null;
    render();
    if (fid) {
      const again = document.getElementById(fid);
      if (again) {
        again.focus();
        if (again.setSelectionRange && start !== null) {
          try { again.setSelectionRange(start, end); } catch (e) { /* not a text field */ }
        }
      }
    }
  }

  async function load(redraw) {
    const data = await WB.get('/api/projects/' + encodeURIComponent(slug));
    document.getElementById('pname').textContent = data.project.name;
    document.getElementById('pdesc').textContent = data.project.description || '';
    items = data.items;
    document.getElementById('eyebrow').textContent =
      (data.counts['needs-you'] || 0) + ' waiting on you · ' + items.length + ' items';
    if (redraw !== false) safeRender();
  }

  async function choose(id, option) {
    note(id, 'saving…');
    try {
      // Choosing an option is an answer, so it lands as `received`: the agent
      // has something to act on and has not yet acknowledged it.
      await WB.patch('/api/items/' + id, { choice: option, status: 'received' });
      await load();
      note(id, 'saved');
    } catch (e) { note(id, e.message, true); }
  }

  async function setStatus(id, status) {
    note(id, 'saving…');
    try {
      await WB.patch('/api/items/' + id, { status });
      await load();
      note(id, 'saved');
    } catch (e) { note(id, e.message, true); }
  }

  async function send(id) {
    const text = (drafts[id] || '').trim();
    if (!text) return;
    note(id, 'sending…');
    try {
      await WB.post('/api/items/' + id + '/messages', { who: 'you', text });
      drafts[id] = '';
      await load();
      note(id, 'sent');
    } catch (e) { note(id, e.message, true); }
  }

  document.getElementById('newitem').addEventListener('submit', async (e) => {
    e.preventDefault();
    const title = document.getElementById('ititle').value.trim();
    if (!title) return;
    await WB.post('/api/projects/' + encodeURIComponent(slug) + '/items', {
      title,
      section: document.getElementById('isection').value.trim(),
    });
    document.getElementById('ititle').value = '';
    await load();
  });

  load();
  setInterval(() => load(), 5000);
})();
</script>
</body>
</html>
