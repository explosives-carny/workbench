<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workbench · item</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="wrap">
  <a class="back" id="back" href="/">&#8592; Back</a>
  <header class="mast">
    <p class="eyebrow" id="eyebrow">Item</p>
    <h1 id="title">…</h1>
    <p class="lede" id="ctx"></p>
    <div class="rule"></div>
  </header>

  <div id="checks"></div>
  <div id="doc"></div>
  <div id="panel"></div>
</div>
<script src="/app.js"></script>
<script src="/md.js"></script>
<script>
(function () {
  const m = location.pathname.match(/^\/p\/([^/]+)\/i\/([^/]+)/);
  const slug = decodeURIComponent(m[1]);
  const itemId = decodeURIComponent(m[2]);
  document.getElementById('back').href = '/p/' + encodeURIComponent(slug);

  let item = null;
  let draft = '';
  let deferred = null;
  let lastSig = null;

  function sig() {
    return JSON.stringify([
      item.version, item.status, item.choice, (item.messages || []).length, item.body.length,
      (item.checks || []).map((c) => c.id + c.result + c.note).join('|'),
    ]);
  }

  function renderDoc() {
    const el = document.getElementById('doc');
    el.innerHTML = '';
    if (!item.body) return;
    if (item.bodyFormat === 'html') {
      // An imported document brings its own stylesheet and its own <h1>. Rendered
      // inline it would fight this page for every selector, so it goes in a
      // sandboxed iframe: the document keeps its own design, and it cannot reach
      // the board's scripts or storage. sandbox="" with no allow-scripts means
      // its own JavaScript does not run either, which is right — these are
      // records, not applications.
      const frame = document.createElement('iframe');
      frame.className = 'bodyframe';
      frame.setAttribute('sandbox', '');
      frame.setAttribute('title', item.title);
      // src, not srcdoc. The document is served from its own URL with its own
      // content-security-policy, which is both faster for a large document and
      // the only way to open it in a tab of its own.
      frame.src = '/api/items/' + encodeURIComponent(item.id) + '/body';
      el.appendChild(frame);
      const note = document.createElement('p');
      note.className = 'framenote mono';
      const size = Math.round(item.bodyLength || item.body.length) / 1024;
      note.textContent = 'Imported document · scripts disabled · ' + size.toFixed(0) + ' KB · ';
      const open = document.createElement('a');
      open.href = frame.src;
      open.target = '_blank';
      open.rel = 'noopener';
      open.textContent = 'open in a new tab';
      note.appendChild(open);
      el.appendChild(note);
    } else if (item.bodyFormat === 'markdown') {
      // Rendered here rather than iframed: Markdown is our own content, it
      // inherits the board's typography, and it stays selectable and printable.
      const doc = document.createElement('article');
      doc.className = 'mddoc';
      doc.innerHTML = MD(item.body);
      el.appendChild(doc);
    } else {
      const pre = document.createElement('pre');
      pre.className = 'doc';
      pre.textContent = item.body;
      el.appendChild(pre);
    }
  }

  // A checklist item: every step separately answerable, all on one item. The
  // note field saves on blur rather than per keystroke, so walking forty-one
  // steps is forty-one writes rather than several hundred.
  function renderChecks() {
    const el = document.getElementById('checks');
    el.innerHTML = '';
    const checks = item.checks || [];
    if (!checks.length) return;

    const done = checks.filter((c) => c.result).length;
    const failed = checks.filter((c) => c.result === 'fail').length;

    const head = document.createElement('div');
    head.className = 'checkhead';
    const prog = document.createElement('span');
    prog.className = 'mono';
    prog.textContent = done + ' of ' + checks.length + ' recorded' + (failed ? ' · ' + failed + ' failed' : '');
    head.appendChild(prog);
    const bar = document.createElement('div');
    bar.className = 'progress';
    const fill = document.createElement('div');
    fill.className = 'fill' + (failed ? ' hasfail' : '');
    fill.style.width = (checks.length ? (done / checks.length) * 100 : 0) + '%';
    bar.appendChild(fill);
    head.appendChild(bar);
    el.appendChild(head);

    for (const c of checks) {
      const row = document.createElement('div');
      row.className = 'checkrow r-' + (c.result || 'none');

      const label = document.createElement('div');
      label.className = 'ck-label';
      label.textContent = c.label;
      row.appendChild(label);

      const btns = document.createElement('div');
      btns.className = 'ck-btns';
      for (const r of ['pass', 'fail', 'skip']) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'ck-btn ck-' + r;
        b.textContent = r === 'pass' ? 'Pass' : r === 'fail' ? 'Fail' : 'Skip';
        b.setAttribute('aria-pressed', c.result === r ? 'true' : 'false');
        b.setAttribute('aria-label', r + ': ' + c.label);
        // Clicking the recorded answer again clears it. A step answered by
        // accident must be returnable to unanswered, which is not the same as
        // recording a failure.
        b.addEventListener('click', () => setCheck(c.id, { result: c.result === r ? '' : r }));
        btns.appendChild(b);
      }
      row.appendChild(btns);

      const note = document.createElement('input');
      note.type = 'text';
      note.className = 'ck-note';
      note.placeholder = 'Note';
      note.value = c.note || '';
      note.setAttribute('aria-label', 'Note for ' + c.label);
      note.addEventListener('blur', () => {
        if (note.value !== (c.note || '')) setCheck(c.id, { note: note.value });
      });
      note.addEventListener('keydown', (e) => { if (e.key === 'Enter') note.blur(); });
      row.appendChild(note);

      el.appendChild(row);
    }
  }

  async function setCheck(checkId, patch) {
    try {
      const res = await WB.patch('/api/items/' + itemId + '/checks/' + checkId, patch);
      item = res.item;
      paint(true);
    } catch (e) { note(e.message, true); }
  }

  function renderPanel() {
    const el = document.getElementById('panel');
    el.innerHTML = '';
    const card = document.createElement('section');
    card.className = 'item s-' + item.status;

    const head = document.createElement('div');
    head.className = 'row';
    const h = document.createElement('h3');
    h.textContent = 'Discussion';
    head.appendChild(h);
    const chip = document.createElement('span');
    chip.className = 'chip s-' + item.status;
    chip.textContent = WB.STATUS_LABELS[item.status];
    head.appendChild(chip);
    card.appendChild(head);

    const msgs = item.messages || [];
    if (msgs.length) {
      const thread = document.createElement('div');
      thread.className = 'thread';
      for (const msg of msgs) {
        const d = document.createElement('div');
        d.className = 'msg ' + (msg.who === 'you' ? 'you' : 'agent');
        const who = document.createElement('div');
        who.className = 'who';
        who.textContent = msg.who === 'you' ? 'You' : (msg.author || 'Agent');
        const p = document.createElement('p');
        p.textContent = msg.text;
        const when = document.createElement('div');
        when.className = 'when';
        when.textContent = WB.fmt(msg.createdAt);
        d.append(who, p, when);
        thread.appendChild(d);
      }
      card.appendChild(thread);
    }

    if (item.options && item.options.length) {
      const opts = document.createElement('div');
      opts.className = 'opts';
      opts.setAttribute('role', 'group');
      opts.setAttribute('aria-label', item.title);
      for (const o of item.options) {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = o;
        b.setAttribute('aria-pressed', item.choice === o ? 'true' : 'false');
        b.addEventListener('click', () => choose(o));
        opts.appendChild(b);
      }
      card.appendChild(opts);
    }

    const box = document.createElement('div');
    box.className = 'replybox';
    const ta = document.createElement('textarea');
    ta.id = 'ta-main';
    ta.placeholder = msgs.length ? 'Reply' : 'Add a note';
    ta.setAttribute('aria-label', 'Reply on: ' + item.title);
    ta.value = draft;
    ta.addEventListener('input', () => { draft = ta.value; });
    ta.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); send(); }
    });
    const sb = document.createElement('button');
    sb.type = 'button';
    sb.className = 'send';
    sb.textContent = 'Send';
    sb.addEventListener('click', send);
    box.append(ta, sb);
    card.appendChild(box);

    const bar = document.createElement('div');
    bar.className = 'statusbar';
    const lbl = document.createElement('label');
    lbl.className = 'lbl';
    lbl.setAttribute('for', 'st-main');
    lbl.textContent = 'Status';
    const sel = document.createElement('select');
    sel.id = 'st-main';
    sel.className = 'status s-' + item.status;
    for (const s of WB.STATUSES) {
      const o = document.createElement('option');
      o.value = s;
      o.textContent = WB.STATUS_LABELS[s];
      if (item.status === s) o.selected = true;
      sel.appendChild(o);
    }
    sel.addEventListener('change', () => setStatus(sel.value));
    bar.append(lbl, sel);
    card.appendChild(bar);

    const saved = document.createElement('div');
    saved.className = 'saved';
    saved.id = 'saved-main';
    card.appendChild(saved);

    el.appendChild(card);
  }

  function note(text, isErr) {
    const el = document.getElementById('saved-main');
    if (el) { el.textContent = text; el.className = 'saved' + (isErr ? ' err' : ''); }
  }

  function paint(force) {
    const s = sig();
    if (!force && s === lastSig) return;
    const live = document.activeElement;
    if (live && (live.id === 'ta-main' || live.classList.contains('ck-note'))) {
      clearTimeout(deferred);
      deferred = setTimeout(() => paint(true), 2500);
      return;
    }
    lastSig = s;
    document.getElementById('title').textContent = item.title;
    document.getElementById('ctx').textContent = item.context || '';
    document.getElementById('eyebrow').textContent =
      (item.section ? item.section + ' · ' : '') + WB.STATUS_LABELS[item.status] +
      (item.choice ? ' · ' + item.choice : '');
    renderChecks();
    renderDoc();
    renderPanel();
  }

  async function load() {
    const data = await WB.get('/api/items/' + encodeURIComponent(itemId));
    item = data.item;
    paint();
  }

  async function choose(option) {
    note('saving…');
    try { await WB.patch('/api/items/' + itemId, { choice: option, status: 'received' }); await load(); note('saved'); }
    catch (e) { note(e.message, true); }
  }
  async function setStatus(status) {
    note('saving…');
    try { await WB.patch('/api/items/' + itemId, { status }); await load(); note('saved'); }
    catch (e) { note(e.message, true); }
  }
  async function send() {
    const text = (draft || '').trim();
    if (!text) return;
    note('sending…');
    try { await WB.post('/api/items/' + itemId + '/messages', { who: 'you', text }); draft = ''; await load(); note('sent'); }
    catch (e) { note(e.message, true); }
  }

  load();
  setInterval(load, 5000);
})();
</script>
</body>
</html>
