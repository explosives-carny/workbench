<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workbench · item</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="wrap">
  <a class="back" id="back" href="/">&#8592; Back</a>
  <header class="mast">
    <p class="eyebrow" id="eyebrow">Item</p>
    <div class="labelrow" id="labels"></div>
    <div class="titlerow">
      <span id="refslot"></span>
      <h1 id="title">…</h1>
    </div>
    <p class="lede" id="ctx"></p>
    <div class="rule"></div>
  </header>

  <div id="checks"></div>
  <div id="doc"></div>
  <div id="panel"></div>
</div>
<script src="/app.js"></script>
<script src="/md.js"></script>
<script>
(function () {
  const m = location.pathname.match(/^\/p\/([^/]+)\/i\/([^/]+)/);
  const slug = decodeURIComponent(m[1]);
  const itemId = decodeURIComponent(m[2]);
  document.getElementById('back').href = '/p/' + encodeURIComponent(slug);

  let item = null;
  let draft = '';
  let deferred = null;
  let lastSig = null;
  // A result clicked but not yet saved because it still needs a note.
  const pendingResult = {};

  function sig() {
    return JSON.stringify([
      item.ref, item.version, item.status, item.choice, (item.messages || []).length, item.body.length,
      (item.checks || []).map((c) => c.id + c.result + c.note).join('|'),
    ]);
  }

  function renderDoc() {
    const el = document.getElementById('doc');
    el.innerHTML = '';
    if (!item.body) return;
    if (item.bodyFormat === 'html') {
      // An imported document brings its own stylesheet and its own <h1>. Rendered
      // inline it would fight this page for every selector, so it goes in a
      // sandboxed iframe: the document keeps its own design, and it cannot reach
      // the board's scripts or storage. sandbox="" with no allow-scripts means
      // its own JavaScript does not run either, which is right — these are
      // records, not applications.
      const frame = document.createElement('iframe');
      frame.className = 'bodyframe';
      frame.setAttribute('sandbox', '');
      frame.setAttribute('title', item.title);
      // src, not srcdoc. The document is served from its own URL with its own
      // content-security-policy, which is both faster for a large document and
      // the only way to open it in a tab of its own.
      frame.src = '/api/items/' + encodeURIComponent(item.id) + '/body';
      el.appendChild(frame);
      const note = document.createElement('p');
      note.className = 'framenote mono';
      const size = Math.round(item.bodyLength || item.body.length) / 1024;
      note.textContent = 'Imported document · scripts disabled · ' + size.toFixed(0) + ' KB · ';
      const open = document.createElement('a');
      open.href = frame.src;
      open.target = '_blank';
      open.rel = 'noopener';
      open.textContent = 'open in a new tab';
      note.appendChild(open);
      el.appendChild(note);
    } else if (item.bodyFormat === 'markdown') {
      // Rendered here rather than iframed: Markdown is our own content, it
      // inherits the board's typography, and it stays selectable and printable.
      const doc = document.createElement('article');
      doc.className = 'mddoc';
      doc.innerHTML = MD(item.body);
      placeChecks(doc);
      el.appendChild(doc);
    } else {
      const pre = document.createElement('pre');
      pre.className = 'doc';
      pre.textContent = item.body;
      el.appendChild(pre);
    }
  }

  // A checklist item: every step separately answerable, all on one item. The
  // note field saves on blur rather than per keystroke, so walking forty-one
  // steps is forty-one writes rather than several hundred.
  function renderChecks() {
    const el = document.getElementById('checks');
    el.innerHTML = '';
    const checks = item.checks || [];
    if (!checks.length) return;

    const done = checks.filter((c) => c.result).length;
    const failed = checks.filter((c) => c.result === 'fail').length;

    const head = document.createElement('div');
    head.className = 'checkhead sticky';
    const prog = document.createElement('span');
    prog.className = 'mono';
    prog.textContent = done + ' of ' + checks.length + ' recorded' + (failed ? ' · ' + failed + ' failed' : '');
    head.appendChild(prog);
    const bar = document.createElement('div');
    bar.className = 'progress';
    const fill = document.createElement('div');
    fill.className = 'fill' + (failed ? ' hasfail' : '');
    fill.style.width = (checks.length ? (done / checks.length) * 100 : 0) + '%';
    bar.appendChild(fill);
    head.appendChild(bar);
    el.appendChild(head);

    // When there IS a document, rows are not listed here — placeChecks() puts
    // each one under the step it belongs to, because recording a result belongs
    // where you finish reading the instruction rather than in a detached list
    // you have to match back up by number.
    //
    // When there is not, this is the only place they can go. QA steps now ride
    // on the item they verify rather than living in a separate runbook, so most
    // checklists have no document at all — a handful of steps under the thread
    // that says what changed.
    if (item.bodyFormat === 'markdown' && item.body) return;
    const list = document.createElement('div');
    list.className = 'checklist';
    for (const c of checks) list.appendChild(checkRow(c, true));
    el.appendChild(list);
  }

  function checkRow(c, withLabel) {
    {
      const row = document.createElement('div');
      row.className = 'checkrow r-' + (c.result || 'none') + (withLabel ? '' : ' inline');

      if (withLabel) {
        const label = document.createElement('div');
        label.className = 'ck-label';
        label.textContent = c.label;
        row.appendChild(label);
      }

      const btns = document.createElement('div');
      btns.className = 'ck-btns';
      for (const r of ['pass', 'fail', 'skip']) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'ck-btn ck-' + r;
        b.textContent = r === 'pass' ? 'Pass' : r === 'fail' ? 'Fail' : 'Skip';
        b.setAttribute('aria-pressed', c.result === r ? 'true' : 'false');
        b.setAttribute('aria-label', r + ': ' + c.label);
        // Clicking the recorded answer again clears it. A step answered by
        // accident must be returnable to unanswered, which is not the same as
        // recording a failure.
        b.addEventListener('click', () => {
          const next = c.result === r ? '' : r;
          // Anything but a pass needs a note, so the click alone is not enough:
          // send the note we already have, and if there is none, put the cursor
          // in the field and save when they have written one rather than
          // recording an unexplained failure or throwing their click away.
          if (next && next !== 'pass' && !String(c.note || '').trim()) {
            pendingResult[c.id] = next;
            row.classList.add('needsnote');
            const field = row.querySelector('.ck-note');
            field.placeholder = 'Why? (required for ' + next + ')';
            field.focus();
            return;
          }
          delete pendingResult[c.id];
          setCheck(c.id, { result: next, note: c.note || '' });
        });
        btns.appendChild(b);
      }
      row.appendChild(btns);

      const note = document.createElement('input');
      note.type = 'text';
      note.className = 'ck-note';
      note.placeholder = 'Note';
      note.value = c.note || '';
      note.setAttribute('aria-label', 'Note for ' + c.label);
      note.addEventListener('blur', () => {
        const pending = pendingResult[c.id];
        if (pending) {
          if (!note.value.trim()) return;  // still required; leave the row armed
          delete pendingResult[c.id];
          setCheck(c.id, { result: pending, note: note.value });
          return;
        }
        if (note.value !== (c.note || '')) setCheck(c.id, { note: note.value });
      });
      note.addEventListener('keydown', (e) => { if (e.key === 'Enter') note.blur(); });
      row.appendChild(note);

      return row;
    }
  }

  // Put each step's controls under that step in the rendered document. Headings
  // that start with a number are the steps; the control goes at the END of the
  // step's content, which is where somebody finishes reading and forms a
  // verdict. A step whose heading is missing falls back to the end of the
  // document rather than being dropped — an unrecordable step is worse than an
  // oddly placed one.
  function placeChecks(container) {
    const checks = item.checks || [];
    if (!checks.length) return;
    const byNumber = new Map();
    for (const c of checks) {
      const m = String(c.label).match(/^(\d+)\./);
      if (m) byNumber.set(m[1], c);
    }
    const headings = [...container.querySelectorAll('h1,h2,h3,h4')];
    const placed = new Set();
    headings.forEach((h, idx) => {
      const m = (h.textContent || '').trim().match(/^(\d+)\./);
      if (!m) return;
      const c = byNumber.get(m[1]);
      if (!c) return;
      // End of this step: just before the next heading at the same level or
      // higher, so the control sits under the whole instruction.
      const level = Number(h.tagName[1]);
      let end = null;
      for (let j = idx + 1; j < headings.length; j++) {
        if (Number(headings[j].tagName[1]) <= level) { end = headings[j]; break; }
      }
      const row = checkRow(c, false);
      if (end) end.parentNode.insertBefore(row, end);
      else container.appendChild(row);
      placed.add(c.id);
    });
    const orphans = checks.filter((c) => !placed.has(c.id));
    if (orphans.length) {
      const head = document.createElement('p');
      head.className = 'framenote mono';
      head.textContent = orphans.length + ' step(s) had no matching heading in the document';
      container.appendChild(head);
      for (const c of orphans) container.appendChild(checkRow(c, true));
    }
  }

  async function setCheck(checkId, patch) {
    try {
      const res = await WB.patch('/api/items/' + itemId + '/checks/' + checkId, patch);
      item = res.item;
      paint(true);
    } catch (e) { note(e.message, true); }
  }

  function renderPanel() {
    const el = document.getElementById('panel');
    el.innerHTML = '';
    const card = document.createElement('section');
    card.className = 'item s-' + item.status;

    // No status chip here. The dropdown at the foot of this card IS the status —
    // it shows the current value and is how you change it. A chip above the
    // reply box restated it a second time, and the eyebrow at the top of the
    // page a third, so the page asserted the same fact three ways and none of
    // them was the control.
    const head = document.createElement('div');
    head.className = 'row';
    const h = document.createElement('h3');
    h.textContent = 'Discussion';
    head.appendChild(h);
    card.appendChild(head);

    const msgs = item.messages || [];
    if (msgs.length) {
      const thread = document.createElement('div');
      thread.className = 'thread';
      for (const msg of msgs) {
        const d = document.createElement('div');
        d.className = 'msg ' + (msg.who === 'you' ? 'you' : 'agent');
        const who = document.createElement('div');
        who.className = 'who';
        who.textContent = msg.who === 'you' ? 'You' : (msg.author || 'Agent') + (msg.session ? '·' + msg.session : '');
        const p = document.createElement('p');
        p.textContent = msg.text;
        const when = document.createElement('div');
        when.className = 'when';
        when.textContent = WB.fmt(msg.createdAt);
        d.append(who, p, when);
        thread.appendChild(d);
      }
      card.appendChild(thread);
    }

    if (item.options && item.options.length) {
      const opts = document.createElement('div');
      opts.className = 'opts';
      opts.setAttribute('role', 'group');
      opts.setAttribute('aria-label', item.title);
      for (const o of item.options) {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = o;
        b.setAttribute('aria-pressed', item.choice === o ? 'true' : 'false');
        b.addEventListener('click', () => choose(o));
        opts.appendChild(b);
      }
      card.appendChild(opts);
    }

    const box = document.createElement('div');
    box.className = 'replybox';
    const ta = document.createElement('textarea');
    ta.id = 'ta-main';
    ta.placeholder = msgs.length ? 'Reply' : 'Add a note';
    ta.setAttribute('aria-label', 'Reply on: ' + item.title);
    ta.value = draft;
    ta.addEventListener('input', () => { draft = ta.value; });
    ta.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); send(); }
    });
    const sb = document.createElement('button');
    sb.type = 'button';
    sb.className = 'send';
    sb.textContent = 'Send';
    sb.addEventListener('click', send);
    box.append(ta, sb);
    card.appendChild(box);

    const bar = document.createElement('div');
    bar.className = 'statusbar';
    const lbl = document.createElement('label');
    lbl.className = 'lbl visually-hidden';
    lbl.setAttribute('for', 'st-main');
    lbl.textContent = 'Status';
    const sel = document.createElement('select');
    sel.id = 'st-main';
    sel.className = 'status s-' + item.status;
    // Only this item's own set — an issue never offers Active, a document
    // never offers Received.
    for (const s of WB.statusesFor(item.kind)) {
      const o = document.createElement('option');
      o.value = s;
      o.textContent = WB.STATUS_LABELS[s];
      if (item.status === s) o.selected = true;
      sel.appendChild(o);
    }
    sel.addEventListener('change', () => setStatus(sel.value));
    bar.append(lbl, sel);
    card.appendChild(bar);

    const saved = document.createElement('div');
    saved.className = 'saved';
    saved.id = 'saved-main';
    card.appendChild(saved);

    el.appendChild(card);
  }

  function note(text, isErr) {
    const el = document.getElementById('saved-main');
    if (el) { el.textContent = text; el.className = 'saved' + (isErr ? ' err' : ''); }
  }

  function paint(force) {
    const s = sig();
    if (!force && s === lastSig) return;
    const live = document.activeElement;
    if (live && (live.id === 'ta-main' || live.classList.contains('ck-note'))) {
      clearTimeout(deferred);
      deferred = setTimeout(() => paint(true), 2500);
      return;
    }
    lastSig = s;
    const refslot = document.getElementById('refslot');
    refslot.innerHTML = '';
    const ref = WB.refChip(item.ref);
    if (ref) refslot.appendChild(ref);
    document.getElementById('title').textContent = item.title;
    document.getElementById('ctx').textContent = item.context || '';
    // Section only. Status is the dropdown; the chosen option is the pressed
    // button. Neither needs restating in the masthead.
    // Section and the date it was raised. The date was nowhere on this page —
    // the thread carries a timestamp per message, so an item nobody had replied
    // to showed no date at all, and one with a long thread showed everything
    // except when the question was actually asked.
    const raised = item.createdAt ? 'Raised ' + WB.fmt(item.createdAt) : '';
    document.getElementById('eyebrow').textContent =
      [item.section, raised].filter(Boolean).join(' · ') || 'Item';
    renderLabels();
    renderChecks();
    renderDoc();
    renderPanel();
  }

  // Labels, shown and editable. Editable here rather than only through the API
  // because a label's whole value is being applied consistently, and a field you
  // can read but not correct drifts within a week. One comma-separated box: the
  // set is small, and chip-with-an-x is more interface than the job needs.
  function renderLabels() {
    const host = document.getElementById('labels');
    host.innerHTML = '';
    const current = item.labels || [];
    for (const label of current) {
      const chip = document.createElement('span');
      chip.className = 'lr-label mono';
      chip.textContent = label;
      host.appendChild(chip);
    }
    const edit = document.createElement('button');
    edit.type = 'button';
    edit.className = 'labeledit mono';
    edit.textContent = current.length ? 'Edit labels' : 'Add labels';
    // An inline editor rather than prompt(): prompt() cannot offer the labels
    // already in use, and a label typed from memory is how "Deploys" ends up
    // beside "Deploy" and a filter misses half the work.
    edit.addEventListener('click', async () => {
      if (host.querySelector('form')) return;
      const form = document.createElement('form');
      form.className = 'labelform';
      const input = document.createElement('input');
      input.type = 'text';
      input.value = current.join(', ');
      input.setAttribute('aria-label', 'Labels, comma separated');
      input.setAttribute('list', 'labellist');
      input.autocomplete = 'off';
      const list = document.createElement('datalist');
      list.id = 'labellist';
      const picks = document.createElement('div');
      picks.className = 'labelpicks';
      const save = document.createElement('button');
      save.type = 'submit';
      save.textContent = 'Save';
      const cancel = document.createElement('button');
      cancel.type = 'button';
      cancel.className = 'labeledit mono';
      cancel.textContent = 'Cancel';
      // Forced: paint() otherwise holds the redraw while a text field has focus,
      // and the field that has focus here is the one being cancelled.
      cancel.addEventListener('click', () => paint(true));
      form.append(input, list, picks, save, cancel);
      host.appendChild(form);
      input.focus();
      try {
        const slug = location.pathname.split('/')[2];
        const res = await WB.get('/api/projects/' + encodeURIComponent(slug) + '/labels');
        WB.labelChoices(res.labels || [], list, picks, input);
      } catch (e) { /* the editor still works without suggestions */ }
      form.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        note('saving…');
        try {
          const res = await WB.patch('/api/items/' + encodeURIComponent(itemId), {
            labels: input.value.split(',').map((l) => l.trim()).filter(Boolean),
            actor: 'you',
            ifVersion: item.version,
          });
          item = res.item;
          paint(true);
          note(res.warning ? res.warning : 'saved', Boolean(res.warning));
        } catch (e) { note(e.message, true); }
      });
    });
    host.appendChild(edit);
  }

  async function load() {
    const data = await WB.get('/api/items/' + encodeURIComponent(itemId));
    item = data.item;
    paint();
  }

  async function choose(option) {
    note('saving…');
    try { await WB.patch('/api/items/' + itemId, { choice: option, status: 'received' }); await load(); note('saved'); }
    catch (e) { note(e.message, true); }
  }
  async function setStatus(status) {
    note('saving…');
    try { await WB.patch('/api/items/' + itemId, { status }); await load(); note('saved'); }
    catch (e) { note(e.message, true); }
  }
  async function send() {
    const text = (draft || '').trim();
    if (!text) return;
    note('sending…');
    try { await WB.post('/api/items/' + itemId + '/messages', { who: 'you', text }); draft = ''; await load(); note('sent'); }
    catch (e) { note(e.message, true); }
  }

  load();
  setInterval(load, 5000);
})();
</script>
</body>
</html>
