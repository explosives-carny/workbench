<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workbench · agent contract</title>
<link rel="stylesheet" href="/app.css">
<style>
  pre.doc {
    background: var(--panel); border: 1px solid var(--rule); border-radius: 6px;
    padding: 20px 22px; overflow-x: auto; white-space: pre-wrap; word-break: break-word;
    font-family: var(--mono); font-size: 13px; line-height: 1.6; color: var(--ink-2);
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">&#8592; All projects</a>
  <header class="mast">
    <p class="eyebrow">Hand this to any agent, any vendor</p>
    <h1>Agent contract</h1>
    <p class="lede">Rendered from <span class="mono">AGENTS.md</span> in the repository, so there is one copy of it rather than two.</p>
    <div class="rule"></div>
  </header>
  <pre class="doc" id="doc">Loading…</pre>
</div>
<script>
fetch('/api-doc')
  .then((r) => r.text())
  .then((t) => { document.getElementById('doc').textContent = t; })
  .catch(() => { document.getElementById('doc').textContent = 'Could not load AGENTS.md from the repository.'; });
</script>
</body>
</html>
